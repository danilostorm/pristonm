name: StormPT Web SDK - offline tests

on:
  push:
    paths:
      - 'web-sdk/**'
      - '.github/workflows/test-web-sdk.yml'
  pull_request:
    paths:
      - 'web-sdk/**'
      - '.github/workflows/test-web-sdk.yml'

permissions:
  contents: read

jobs:
  web-sdk-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline gateway-client contract tests
        run: node --test web-sdk/tests/client.test.mjs